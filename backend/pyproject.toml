[project]
name = "ripple-backend"
version = "0.1.0"
description = "Ripple - resilience-based academic routing engine (API + solver)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "networkx>=3.4",
    "ortools>=9.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Phase 2 adds the "ripplepath" solver package here.
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
